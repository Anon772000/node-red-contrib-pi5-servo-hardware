<script type="text/html" data-template-name="pi-site-local-rules"><div class="form-row"><label for="node-input-name">Name</label><input id="node-input-name"></div><p>Save the hub thresholds on disk and use local sensor readings when the hub becomes unreachable. Storage location and timeout come from Site settings.</p></script>
<script type="text/html" data-help-name="pi-site-local-rules"><p>Receives hub configuration, local telemetry, actual output feedback, MQTT status and start/stop messages. Valid configuration updates are saved atomically and loaded after a restart. The node emits local valve/vent commands only when the hub heartbeat has stopped or MQTT disconnects.</p><p>Retained configuration is accepted as cached thresholds; retained commands are rejected. The last thresholds remain usable without internet. Invalid configuration keeps the previous valid cache. Readings must be fresh, watering remains time-limited, and active hub manual overrides are respected.</p></script>
