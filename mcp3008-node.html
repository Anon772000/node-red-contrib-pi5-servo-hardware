RED.nodes.registerType('pi-site-mcp3008-soil',{category:'Raspberry Pi',color:'#E9967A',defaults:{name:{value:''}},inputs:1,outputs:1,icon:'font-awesome/fa-leaf',label:function(){return this.name||'XC4604 / MCP3008 soil';}});

<script type="text/html" data-template-name="pi-site-mcp3008-soil"><div class="form-row"><label for="node-input-name">Name</label><input id="node-input-name"></div><p>Read XC4604 soil moisture through an MCP3008 ADC. SPI bus, chip select, ADC channel, speed and calibration come from the single Site settings Change node.</p></script>
<script type="text/html" data-help-name="pi-site-mcp3008-soil"><p>Accepts <code>msg.action = "read"</code>. Outputs <code>msg.payload.soilRaw</code> from 0 to 1023, with sensor XC4604. SPI errors produce no measurement. SPI has no acknowledgement: a disconnected ADC or probe can still produce an apparently valid reading.</p><p>Enable SPI before use. Power ADC VDD/VREF and sensor + from 3.3 V, with common ground. Connect ADC CLK to GPIO11/pin23, DOUT to GPIO9/pin21, DIN to GPIO10/pin19, CS to GPIO8/pin24 (CE0); sensor S to ADC CH0. For CE1 use GPIO7/pin26. Record dry and wet calibration readings before clearing the estimated flag.</p></script>
